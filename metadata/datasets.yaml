# Dataset configuration for scripts/03_extract_myeloid.py and 04_extract_cd8.py
# Loader types: mtx (10x-style matrix market), h5ad_raw (.X z-scored, unscaled in .raw), h5ad_counts (raw counts in .X)
# Step 'select' keys: include / exclude (column -> values), include_prefix (column -> prefix)
# Cluster numbers below are LEGACY choices taken from scripts 03/04; marker_checks fail loudly if numbering shifts.

defaults:
  seed: 0

GSE140228:
  raw_dir: data/raw/GSE140228
  loader: mtx
  counts: GSE140228_UMI_counts_Droplet.mtx.gz
  genes: GSE140228_UMI_counts_Droplet_genes.tsv.gz
  cellinfo: GSE140228_UMI_counts_Droplet_cellinfo.tsv.gz
  barcode_col: Barcode
  patient_col: Donor
  tissue_col: Histology
  prefilter:
    include: {Histology: [HCC]}
    exclude: {celltype_global: [Myeloid-Liver-doublets]}
  compartments:
    myeloid:
      steps:
        - select:
            include: {celltype_global: [Myeloid]}    # excludes the separate 'Myeloid-Mast' label (446 cells)
            exclude_prefix: {celltype_sub: Mast}     # 19 Mast-C2-CPA3 cells sit inside 'Myeloid'
      report_key: celltype_sub
      expected_n: 8956                               # 8,975 'Myeloid' minus 19 mast cells
    cd8:
      steps:
        - select:
            include:
              celltype_sub: [CD8-C3-IL7R, CD8-C4-CX3CR1, CD8-C5-SELL, CD8-C6-GZMK,
                             CD8-C7-KLRD1, CD8-C8-PDCD1, CD8-C9-SLC4A10, CD4/CD8-C2-MKI67]
      report_key: celltype_sub
      flags: true
      drop_flags: []

GSE156625:
  raw_dir: data/raw/GSE156625
  loader: h5ad_raw
  counts: GSE156625_HCCscanpyobj.h5ad
  patient_col: patient_id
  tissue_col: NormalvsTumor
  prefilter: {}
  compartments:
    myeloid:
      steps:
        - select:
            include: {louvain: ["8", "10"]}
          recluster: {key: myeloid_subcluster, n_hvg: 2000, n_pcs: 20, resolution: 0.5}
          marker_checks: {"2": SPP1, "5": FCN1, "3": CD1C, "8": CLEC9A}
          on_check_fail: error
          keep: ["2", "3", "4", "5", "6", "8"]
          legacy_labels:         # reference only
            "2": TAM_SPP1
            "4": TAM_FOLR2_TREM2
            "6": TAM_C1QA_MS4A7
            "5": Mono_FCN1_VCAN
            "3": cDC2_CD1C
            "8": cDC1_CLEC9A
      expected_n: 3525
    cd8:
      steps:
        - select:
            include: {louvain: ["0", "1", "3", "4", "5", "9", "12", "15", "22"]}
          recluster: {key: tnk_subcluster, n_hvg: 2000, n_pcs: 20, resolution: 0.6,
                      neighbors_kwargs: {transformer: sklearn}}
          keep: ["0", "5", "10"]
        - recluster: {key: cd8_subcluster, n_hvg: 1500, n_pcs: 15, resolution: 0.5,
                      neighbors_kwargs: {method: gauss}}
      flags: true
      drop_flags: []
      expected_n: 9579

GSE149614:                     
  raw_dir: data/processed        # converted by scripts/02a_convert_GSE149614_counts.py
  loader: h5ad_counts            # integer raw counts confirmed
  counts: GSE149614_all_raw.h5ad
  extra_obs: metadata/GSE149614_doublets.csv   
  patient_col: patient
  tissue_col: site               # Tumor / Normal / PVTT / Lymph; all sites kept here, filtered downstream
  prefilter: {}
  compartments:
    # FROZEN discovery definitions (2026-11-19), chosen from the *_explore2 marker/DEG tables. Cluster numbers
    # depend on the exact settings below (seed 0, Harmony by patient, HVG exclusion); marker_checks fail loudly
    myeloid:
      steps:
        - select:
            include: {celltype: [Myeloid]}
          recluster: {key: myeloid_subcluster, n_hvg: 2000, n_pcs: 20, resolution: 0.5,
                      harmony_key: patient, neighbors_kwargs: {transformer: sklearn},
                      hvg_exclude_regex: "^(HSP|DNAJ|FOS|JUN|ATF3|IER2|IER3|DUSP1|BAG3|ZFAND2A|RP[SL][0-9]|MT-)"}
          print_markers: [CD68, CD14, FCGR3A, VCAN, FCN1, S100A8, C1QA, C1QB, FOLR2, MARCO, CD5L, SPP1, MMP9,
                          TREM2, GPNMB, APOE, LPL, CD9, CD1C, CLEC9A, LAMP3, CPA3, TPSAB1, CD3D, CD8A, NKG7,
                          MS4A1, ALB, APOA1, PLVAP, COL1A1, MZB1, HSPA1A, MKI67]
          print_degs: 8
          marker_checks: {"1": FCN1, "2": SPP1, "7": CLEC9A, "8": MZB1}
          on_check_fail: error
          keep: ["0", "1", "2", "3", "5", "7"]     # dropped: 4, 6 (hepatocyte-contaminated), 8 (plasma/pDC-like)
          cluster_labels:
            "0": ribosomal_low_information
            "1": monocyte_FCN1
            "2": TAM_SPP1_MMP9
            "3": TAM_C1Q_APOE_FOLR2
            "5": Kupffer_CD5L_MARCO
            "7": cDC1_CLEC9A
      expected_n: 15065
    cd8:
      steps:
        - select:
            include: {celltype: [T/NK]}
          recluster: {key: tnk_subcluster, n_hvg: 2000, n_pcs: 20, resolution: 0.6,
                      harmony_key: patient, neighbors_kwargs: {transformer: sklearn},
                      hvg_exclude_regex: "^(HSP|DNAJ|FOS|JUN|ATF3|IER2|IER3|DUSP1|BAG3|ZFAND2A|RP[SL][0-9]|MT-)"}
          print_markers: [CD3D, CD3E, CD8A, CD8B, CD4, FOXP3, NKG7, KLRD1, KLRB1, GNLY, TYROBP, PDCD1, HAVCR2,
                          LAG3, TIGIT, TOX, CTLA4, ENTPD1, CXCL13, LAYN, TNFRSF9, CD27, ICOS, CD38, EOMES,
                          GZMK, GZMB, PRF1, TCF7, IL7R, CCR7, MKI67, STMN1,
                          SPP1, APOE, HLA-DRA, CD68, MS4A1, IGHG1, MZB1, PECAM1, SPARC, ALB, APOA1, KRT18,
                          HSPA1A]
          print_degs: 8
          marker_checks: {"2": CCR7, "3": GNLY, "7": KLRB1, "8": FOXP3, "9": TYROBP, "10": MKI67, "12": MZB1}
          on_check_fail: error
          keep: ["0", "1", "6", "10"]   # set aside: 7 (MAIT/Tc17-like); not CD8: 2, 8; NK: 3, 9; contaminants: 4, 5, 11, 12
          cluster_labels:
            "0": CD8_cytotoxic_GZMH
            "1": CD8_GZMK_KLRB1
            "6": CD8_tumor_enriched_ambient_RNA_risk   # carries APOE/SPP1/HLA-DRA ambient signal: check doublets
            "10": CD8_proliferating_exhaustion_like
      flags: true
      expected_n: 10714